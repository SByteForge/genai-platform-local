name: Reusable - Deploy to Local Kind Cluster (GitOps via ArgoCD)

# Runs on a self-hosted runner registered on the machine that owns the local
# "genai-platform-local" kind cluster — GitHub-hosted runners cannot reach it.
#
# GitOps: this workflow no longer runs `helm upgrade` itself. ArgoCD
# (installed in-cluster, infra/argocd/) watches each environment's branch
# and auto-syncs — it is the only thing that actually applies changes to
# the cluster now. This job's job is just to make the change *in git*: bump
# the image repository/tag in the environment's values.yaml and push, with
# [skip ci] so that push doesn't re-trigger this same workflow. ArgoCD picks
# it up from there. Switched from directly running `helm upgrade` because
# doing both at once (CD applying directly, ArgoCD watching the same
# resources with selfHeal) makes the two fight each other — whichever
# doesn't match git gets reverted.
#
# The RBAC step still runs (an app's Kubernetes identity is still real
# infrastructure, still worth having even though it's no longer on the
# critical path for the actual deploy). The smoke test still uses the
# runner's admin context, same reasoning as before: `kubectl run` needs
# unrestricted pod-create.

on:
  workflow_call:
    inputs:
      environment:
        description: "dev | qa | prod"
        required: true
        type: string
      app_name:
        required: true
        type: string
      values_file:
        description: "Path (relative to repo root) to the environment's Helm values file"
        required: true
        type: string
      image_repository:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      health_path:
        required: false
        type: string
        default: /health
      runner_label:
        required: false
        type: string
        default: self-hosted
      argocd_app:
        description: "Name of the ArgoCD Application to wait on"
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ${{ inputs.runner_label }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply app RBAC (ServiceAccount/Role/RoleBinding/token for this app+env)
        run: |
          kubectl config use-context kind-genai-platform-local
          kubectl apply -f "infra/k8s/rbac/${{ inputs.app_name }}/${{ inputs.environment }}/"

      - name: Bump image tag in git (the actual GitOps trigger)
        id: bump
        run: |
          sed -i.bak -E "s|^(  repository: ).*|\1${{ inputs.image_repository }}|" "${{ inputs.values_file }}"
          sed -i.bak -E "s|^(  tag: ).*|\1${{ inputs.image_tag }}|" "${{ inputs.values_file }}"
          rm -f "${{ inputs.values_file }}.bak"
          git diff "${{ inputs.values_file }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.values_file }}"
          if git diff --cached --quiet; then
            echo "No change (image already at this tag) — nothing to commit."
          else
            git commit -m "deploy(${{ inputs.environment }}): ${{ inputs.app_name }} -> ${{ inputs.image_tag }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Force ArgoCD to refresh against this exact commit
        run: |
          kubectl config use-context kind-genai-platform-local
          # Without this, ArgoCD's own poll loop can pick up the branch's
          # earlier state (before this job's commit above landed) and sync
          # to that first — found live, promoting prod: it briefly deployed
          # a placeholder tag that was never built. A hard refresh forces
          # it to re-evaluate right now instead of on its next poll cycle.
          kubectl -n argocd annotate application ${{ inputs.argocd_app }} argocd.argoproj.io/refresh=hard --overwrite

      - name: Wait for ArgoCD to sync to this exact commit
        run: |
          kubectl config use-context kind-genai-platform-local
          TARGET_REVISION="${{ steps.bump.outputs.revision }}"
          for i in $(seq 1 60); do
            REVISION=$(kubectl get application ${{ inputs.argocd_app }} -n argocd -o jsonpath='{.status.sync.revision}' 2>/dev/null || echo "")
            SYNC=$(kubectl get application ${{ inputs.argocd_app }} -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "")
            HEALTH=$(kubectl get application ${{ inputs.argocd_app }} -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "")
            echo "revision=$REVISION (target=$TARGET_REVISION) sync=$SYNC health=$HEALTH"
            # Checking sync+health alone isn't enough: that can be true
            # against a stale, already-synced-and-broken earlier commit.
            # Only the exact target revision proves this deploy's own
            # change is what's actually live.
            if [ "$REVISION" = "$TARGET_REVISION" ] && [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ]; then
              echo "ArgoCD is synced to this deploy's own commit and healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for ArgoCD to sync to $TARGET_REVISION."
          exit 1

      - name: Smoke test
        run: |
          kubectl config use-context kind-genai-platform-local
          kubectl run "smoke-${{ inputs.app_name }}-${{ inputs.environment }}" \
            --rm -i --restart=Never --image=curlimages/curl -n "${{ inputs.environment }}" -- \
            curl -sf "http://${{ inputs.app_name }}-${{ inputs.environment }}.${{ inputs.environment }}.svc.cluster.local${{ inputs.health_path }}"
