name: CD

# Branch -> environment mapping:
#   dev  -> dev   (auto)
#   qa   -> qa    (auto)
#   main -> prod  (auto, gate with a GitHub Environment protection rule)

on:
  push:
    branches: [dev, qa, main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      image_name: ${{ steps.lower.outputs.image_name }}
    steps:
      - id: map
        run: |
          case "${{ github.ref_name }}" in
            dev) echo "environment=dev" >> "$GITHUB_OUTPUT" ;;
            qa) echo "environment=qa" >> "$GITHUB_OUTPUT" ;;
            main) echo "environment=prod" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: lower
        # GHCR requires a lowercase repository path; github.repository preserves
        # the owner's actual case (e.g. SByteForge), which Docker rejects as a tag.
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build-push:
    needs: resolve-env
    uses: ./.github/workflows/reusable-build-push.yml
    with:
      image_name: ${{ needs.resolve-env.outputs.image_name }}
      image_tag: ${{ needs.resolve-env.outputs.environment }}-${{ github.sha }}

  deploy:
    needs: [resolve-env, build-push]
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: ${{ needs.resolve-env.outputs.environment }}
      app_name: rag-platform-api
      values_file: deploy/environments/${{ needs.resolve-env.outputs.environment }}/values.yaml
      image_repository: ghcr.io/${{ needs.resolve-env.outputs.image_name }}
      image_tag: ${{ needs.resolve-env.outputs.environment }}-${{ github.sha }}
