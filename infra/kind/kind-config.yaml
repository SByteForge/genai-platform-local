kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local-ai-platform
nodes:
  - role: control-plane
    extraPortMappings:
      # for Phase 4 ingress — harmless to reserve now, unused until then
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
