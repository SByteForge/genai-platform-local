# See dev/token-secret.yaml for why this exists (durable token for CD to
# authenticate as this app's scoped identity, not the runner's admin config).
apiVersion: v1
kind: Secret
metadata:
  name: rag-platform-api-deployer-token
  namespace: qa
  annotations:
    kubernetes.io/service-account.name: rag-platform-api-deployer
type: kubernetes.io/service-account-token
