apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rag-platform-api-deployer
  namespace: qa
rules:
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    resourceNames: ["rag-platform-api-qa"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["rag-platform-api-qa"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    resourceNames: ["rag-platform-api-qa"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["rag-platform-api-qa"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["rag-platform-api-qa-table-init"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # See dev/role.yaml for why Secrets can't be resourceNames-scoped (Helm's
  # own revision-numbered release secrets).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
