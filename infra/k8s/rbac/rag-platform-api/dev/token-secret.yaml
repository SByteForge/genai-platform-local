# Long-lived token for the CD workflow to authenticate as this app's scoped
# identity, instead of the runner's own admin kubeconfig. (kubectl create
# token gives a short-lived token unsuitable for a stored kubeconfig; this
# annotation-based Secret is the standard way to get a durable one since
# Kubernetes 1.24 stopped auto-creating these.)
apiVersion: v1
kind: Secret
metadata:
  name: rag-platform-api-deployer-token
  namespace: dev
  annotations:
    kubernetes.io/service-account.name: rag-platform-api-deployer
type: kubernetes.io/service-account-token
