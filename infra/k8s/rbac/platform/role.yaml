# Only the platform repo's own deploy identity gets this Role. No app's
# ServiceAccount ever receives a RoleBinding in this namespace — that
# absence, not an explicit deny, is what keeps apps out of "platform".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-deployer
  namespace: platform
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
