{{- if .Values.tableInit.enabled }}
# Helm hook: runs after every install/upgrade to ensure this environment's
# DynamoDB table exists in the shared LocalStack instance. Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app-chart.fullname" . }}-table-init
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: table-init
          image: {{ .Values.tableInit.image }}
          command:
            - sh
            - -c
            - |
              set -e
              aws dynamodb describe-table --table-name "$TABLE_NAME" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null 2>&1 && \
                echo "table $TABLE_NAME already exists" && exit 0
              aws dynamodb create-table \
                --table-name "$TABLE_NAME" \
                --attribute-definitions AttributeName=id,AttributeType=S \
                --key-schema AttributeName=id,KeyType=HASH \
                --billing-mode PAY_PER_REQUEST \
                --endpoint-url "$AWS_ENDPOINT_URL"
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
{{- end }}
